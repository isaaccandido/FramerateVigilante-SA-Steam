; Framerate Vigilante SA Steam - https://github.com/isaaccandido/FramerateVigilante-SA-Steam
; Keep the in-game Frame Limiter ON. This value replaces the game's 30 FPS cap.
; The original mod is designed for 60 FPS max.
[Settings]
FPSlimit=60

; Temporarily lowers the cap where the game still misbehaves (1 = on, 0 = off).
; Limits only ever lower your cap: Minigames 30 (pool, date), Missions 50 (DRUGS1 interior),
; Cutscenes 60, ScriptedCutscenes 80, Schools 80.
[AutoLimitFPS]
ForMissions=1
ForMinigames=1
ForSchools=1
ForCutscenes=1
ForScriptedCutscenes=1
