name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zig
        run: pip install ziglang==0.16.0

      - name: Build ASI (32-bit Windows)
        run: |
          mkdir -p build
          python -m ziglang cc -target x86-windows-gnu -O2 -shared -Wall -Wextra -Werror \
            -o build/FramerateVigilanteSteam.asi src/main.c

      # The harness needs a relocated gta-sa.exe, which can't be in the repo; CI only checks it compiles.
      - name: Compile test harness
        run: python -m ziglang cc -target x86-linux-musl -static -O1 -Wall -Werror -Itest/shim -o build/harness test/harness.c

      - uses: actions/upload-artifact@v4
        with:
          name: FramerateVigilanteSteam
          path: |
            build/FramerateVigilanteSteam.asi
            FramerateVigilanteSteam.ini

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/FramerateVigilanteSteam.asi
            FramerateVigilanteSteam.ini
